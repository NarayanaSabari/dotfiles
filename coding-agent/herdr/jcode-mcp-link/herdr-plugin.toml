id = "sabari.jcode-mcp-link"
name = "jcode MCP link"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Symlink the main checkout's .jcode/mcp.json into every new worktree"
platforms = ["linux", "macos"]

[[events]]
on = "worktree.created"
command = ["sh", "link.sh"]

[[actions]]
id = "sync"
title = "Link jcode MCP config into all worktrees"
contexts = ["workspace"]
command = ["sh", "link.sh"]
